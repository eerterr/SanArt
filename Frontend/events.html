<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>СанАрт — Ивенты</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/events.css" />
</head>
<body>
  <!-- SVG-фильтр для "пиксельных" дисплейных заголовков (используется через .pixel-heading) -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="sanart-pixelate" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main">
      <div id="topbar-mount"></div>

      <div class="content">
        <section class="dashboard-controls">
          <img class="events-hero__img" src="assets/img/events-title.png" alt="Ивенты" />
        </section>

        <div id="dq-banner"></div>

        <div class="period-tabs-row">
          <div class="period-tabs" role="tablist" aria-label="Период">
            <button class="period-tab period-tab--active" data-period="today" type="button">Сегодня</button>
            <button class="period-tab" data-period="yesterday" type="button">Вчера</button>
            <button class="period-tab" data-period="week" type="button">Неделя</button>
            <button class="period-tab" data-period="month" type="button">Месяц</button>
            <button class="period-tab" data-period="quarter" type="button">Квартал</button>
          </div>
          <button class="icon-btn" type="button" aria-label="Ещё">⋮</button>
        </div>

        <section class="dashboard-controls">
          <h2 class="section-title">Все мероприятия</h2>
        </section>

        <div class="event-cards" id="event-cards" aria-label="Мероприятия"></div>
      </div>
    </main>
  </div>

  <div class="overlay" id="app-overlay" hidden>
    <div class="overlay__panel" id="app-overlay-panel"></div>
  </div>

  <div id="ai-widget-mount"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components/sidebar.js"></script>
  <script src="assets/js/components/topbar.js"></script>
  <script src="assets/js/components/ai-widget.js"></script>
  <script src="assets/js/pages/events.js"></script>
</body>
</html>
